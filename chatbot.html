<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BrightPath HR Chatbot</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 16px/1.5 system-ui, sans-serif;
      color: #183044;
      background: #f2f6f8;
    }
    main {
      max-width: 760px;
      margin: 60px auto;
      padding: 32px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px #18304415;
    }
    h1 { margin-top: 0; color: #126b78; }
    label { display: block; margin-bottom: 8px; font-weight: 600; }
    textarea {
      width: 100%;
      min-height: 100px;
      padding: 12px;
      font: inherit;
      border: 1px solid #b8c8d0;
      border-radius: 8px;
      resize: vertical;
    }
    button {
      margin-top: 12px;
      padding: 11px 22px;
      border: 0;
      border-radius: 8px;
      background: #126b78;
      color: white;
      font: inherit;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #status { min-height: 24px; color: #526775; }
    #answer {
      white-space: pre-wrap;
      background: #eef7f7;
      padding: 18px;
      border-radius: 8px;
    }
    #error { color: #b42318; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>BrightPath HR Chatbot</h1>
    <p>Ask a question about the BrightPath Employee Handbook.</p>

    <form id="chat-form">
      <label for="question">Your question</label>
      <textarea id="question" required
        placeholder="For example: What are the working hours?"></textarea>
      <button id="send" type="submit">Ask</button>
    </form>

    <p id="status" role="status"></p>
    <p id="error" role="alert"></p>

    <section id="result" hidden>
      <h2>Answer</h2>
      <div id="answer"></div>
    </section>
  </main>

  <script>
    const webhookUrl =
      "https://marwannn1.app.n8n.cloud/webhook/a6f6f49d-ff44-4f81-8b67-e59a6ed5fe2d";

    const form = document.getElementById("chat-form");
    const question = document.getElementById("question");
    const send = document.getElementById("send");
    const status = document.getElementById("status");
    const error = document.getElementById("error");
    const result = document.getElementById("result");
    const answer = document.getElementById("answer");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      send.disabled = true;
      status.textContent = "Searching the handbook…";
      error.textContent = "";
      result.hidden = true;

      try {
        const response = await fetch(webhookUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: question.value.trim() })
        });

        if (!response.ok) {
          throw new Error(`Request failed (${response.status}).`);
        }

        const raw = await response.text();
        let data;
        try { data = JSON.parse(raw); }
        catch { data = raw; }

        if (Array.isArray(data)) data = data[0];

        const reply = typeof data === "string"
          ? data
          : data?.answer ?? data?.output ?? data?.response ?? data?.message;

        if (!reply) throw new Error("The workflow returned no answer.");

        answer.textContent = String(reply);
        result.hidden = false;
      } catch (problem) {
        error.textContent = problem.message || "Could not reach the chatbot.";
      } finally {
        status.textContent = "";
        send.disabled = false;
      }
    });
  </script>
</body>
</html>
